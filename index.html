o+=b+r(10,18,2,4,Y)+r(7,16,3,2,D)+r(7,18,4,3,G)+r(7,18,4,1,G2)+r(18,17,4,3,G)+r(18,17,4,1,G2)}
else if(s=='wave')o+=dn(6)+r(19,16,6,2,D)+up(24,'25px 17px');
else if(s=='happy')o+=r(3,16,6,2,D)+r(19,16,6,2,D)+up(1,'2px 17px',1)+up(24,'25px 17px');
else o+=dn(6)+dn(19);
o+=r(8,1,12,1,K)+r(6,2,16,1,K)+r(4,3,20,11,K)+r(5,14,18,1,K)+r(7,15,14,1,K)+r(7,2,14,1,D)+r(5,3,18,11,D)+r(6,14,16,1,D)+r(8,2,5,1,L)+r(6,3,3,1,L)+r(4,5,20,3,K)+r(7,5,4,1,'#1b2133')+r(7,8,14,4,S)+r(6,12,16,1,K);
if(s=='happy')o+=r(9,9,1,2,K)+r(10,8,1,1,K)+r(11,9,1,2,K)+r(16,9,1,2,K)+r(17,8,1,1,K)+r(18,9,1,2,K)+r(11,13,1,1,L)+r(12,14,4,1,L)+r(16,13,1,1,L);
else if(s=='sad')o+=r(9,8,3,3,K)+r(16,8,3,3,K)+r(9,8,2,1,W)+r(16,8,2,1,W)+r(11,10,1,1,W)+r(18,10,1,1,W)+r(12,13,4,1,L)+r(11,14,1,1,L)+r(16,14,1,1,L)+`<g class="tear">${r(8,11,1,3,T)+r(19,11,1,3,T)}</g>`;
else o+=r(9,8,3,3,K)+r(16,8,3,3,K)+r(10,8,1,1,W)+r(17,8,1,1,W)+r(9,10,1,1,'#2b2f3d')+r(16,10,1,1,'#2b2f3d');
return `<div class="nj ${s}" style="width:${w}px"><svg viewBox="-2 0 32 26" style="overflow:visible">${o}</svg></div>`}
const att=()=>ld('cnp_att')||[];
let S={scr:'intro',name:'',dept:'',i:0,sel:[],rev:null,scores:[],cf:null,err:'',last:false,key:''},taps=0,LAB={};
const tiers=[[92,'PHISHING DETECTIVE','Excellent instincts. Keep verifying and reporting unusual requests.'],[76,'STRONG DEFENDER','A few subtle clues slipped through. Check context and destinations.'],[56,'RISING ANALYST','Good foundation. Slow down on requests about credentials, money or customer data.'],[0,'KEEP INVESTIGATING','Verify senders independently and escalate requests that bypass security.']];
function hs(it,x){LAB[it.id]=it.text;const on=S.sel.includes(it.id);let c=on?' sel':'';if(S.rev){const k=S.rev.ok.includes(it.id);c=k?(on?' ok':' miss'):(on?' bad':'')}return `<button class="hs${c}${x||''}" data-a="tg" data-v="${it.id}" ${S.rev?'disabled':''}>${E(it.text)}</button>`}
function email(s){const m=s.mail,e=m.sender_name.text.slice(0,2).toUpperCase();
let h=`<div class="card em"><div class="mh">${hs(m.subject)}</div><div class="hd"><span class="av">${E(e)}</span><div>${hs(m.sender_name)} &lt;${hs(m.sender_local)}@${hs(m.sender_domain)}&gt;<div class="ml">To: ${hs(m.to)} ${hs(m.date)}</div>${m.reply_to?`<div class="ml">Reply-to: ${hs(m.reply_to)}</div>`:''}</div></div><div class="eb">`;
for(const x of m.sections){if(x.type=='paragraph')h+=`<p>${x.parts.map(p=>hs(p)).join(' ')}</p>`;else if(x.type=='attachment')h+=`<p><span class="chip">📎 ${hs({id:x.id,text:x.text})} <small>${E(x.size)}</small></span></p>`;else h+=`<p>${hs({id:x.id,text:x.text},' cta')}<br><small class="du">Destination: ${E(x.url)}</small></p>`}
return h+'</div></div>'}
const prog=()=>`<div class="prog">`+SC.map((_,k)=>`<span class="${k<S.scores.length?(S.scores[k]>=12?'ok':'no'):k==S.i?'cur':''}">${k<S.scores.length||k==S.i?'✦':'<b>✦</b>'}</span>`).join('')+`</div>`;
const sub=t=>`<div class="sm" style="font:600 13px/1.5 system-ui,sans-serif;letter-spacing:0">${t}</div>`;
function render(){let h='',a=$('app');
if(S.scr=='intro')h=`<div class="sm" id="tt">CYBER AWARENESS MONTH</div><h1 style="margin-top:6px">CYBER<br>NINJA</h1>${nj('wave',150)}<div class="sm">SPOT THE PHISH</div><button class="btn blue" data-a="start">START</button><button class="btn org" data-a="board">LEADERBOARD</button><div class="track"><div class="nj run" style="width:44px">${nj('idle',44).replace(/^<div[^>]*>|<\/div>$/g,'')}</div><span class="star">✦</span></div>`;
if(S.scr=='reg')h=`<div class="sm" style="color:var(--yel)">01 / THE CLAN</div><h2>REGISTER YOUR NINJA</h2><input id="nm" class="inp" maxlength="40" placeholder="YOUR NAME" value="${E(S.name)}"><div class="grid">${DEPTS.map(d=>`<button class="opt ${S.dept==d?'on':''}" data-a="pick" data-v="${E(d)}">${E(d)}</button>`).join('')}</div><button class="btn org" data-a="go" ${S.name&&S.dept?'':'disabled'}>CONTINUE</button>`;
if(S.scr=='play'){const s=SC[S.i],em=email(s);
h=`<div style="font-size:16px;text-shadow:0 0 10px #fff">MISSION ${S.i+1} OF 5</div>${prog()}<h2 style="font-size:13px">${E(s.name)} <span class="sm" style="color:#ff8a2a">· ${E(s.difficulty)}</span></h2>${sub(E(s.context))}${nj(S.rev?(S.rev.n>=3?'happy':'sad'):'idle',S.rev?100:80)}${em}`;
if(!S.rev)h+=`<div class="sm" style="color:${S.err?'#ff6b6b':'var(--yel)'}">${S.err||'CLUES '+S.sel.length+' / 5 · TAP EXACTLY FIVE'}</div><button class="btn grn" data-a="sub" ${S.sel.length==5?'':'disabled'}>SUBMIT</button>`;
else{const li=Object.entries(s.signals).map(([id,t])=>`<li><b>${S.sel.includes(id)?'✓':'!'} ${E(t[0])}</b><br>${E(t[1])}</li>`).join('')+S.sel.filter(id=>!s.signals[id]).map(id=>`<li><b>× Not a key indicator</b><br>“${E(LAB[id]||'')}” is context here. Look for unsafe requests, mismatched destinations and bypassed controls.</li>`).join('');
h+=`<div class="v ${S.rev.n>=3?'g':'r'}">${S.rev.n==5?'PERFECT! +20':'FOUND '+S.rev.n+' OF 5 · +'+S.rev.pts}</div><div class="panel"><div class="sm" style="color:var(--yel)">⚑ RED FLAGS</div><ul class="fl">${li}</ul></div><button class="btn yel" data-a="next">${S.i<4?'NEXT MISSION':'FINAL SCORE'}</button>`}}
if(S.scr=='end'){const t=tiers.find(x=>S.total>=x[0]);
h=`<div class="sm" style="color:var(--yel)">LEVEL COMPLETE ★</div><h2>MISSION COMPLETE</h2>${nj(S.total>=56?'happy':'sad',130)}<div class="big">${S.total}</div><div class="sm">OUT OF 100 · ${E(S.name)}</div><div class="btn yel" style="cursor:default;padding:14px 6px;font-size:12px">${t[1]}</div>${sub(t[2])}<div class="panel">${SC.map((s,k)=>`<div class="tier">${k+1}. ${E(s.name)} — ${S.scores[k]} / 20</div>`).join('')}</div><button class="btn org" data-a="board">SEE LEADERBOARD</button>`}
if(S.scr=='board'){const T={},C={};att().forEach(x=>{T[x.dept]=(T[x.dept]||0)+x.total;C[x.dept]=(C[x.dept]||0)+1});const rows=DEPTS.map(d=>[d,T[d]||0,C[d]||0]).sort((a,b)=>b[1]-a[1]),mx=rows[0][1];
h=`${nj('wave',100)}<h2>THE LEADERBOARD ★</h2><div class="sm">${mx?'TOP CLAN: '+E(rows[0][0]):'NO SCORES YET'}</div><div class="lb">${rows.map((r,i)=>{const me=r[0]==S.dept&&S.last;return `<div class="lr ${i<3&&r[1]?'t'+(i+1):''} ${me?'me':''}"><span class="rk">${i+1}</span><div class="nm">${E(r[0])}${me?'<em>YOU</em>':''}<small style="font-weight:600;color:#9fb3d9"> · ${r[2]} played</small><div class="bar"><i style="width:${mx?r[1]/mx*100:0}%"></i></div></div><span class="pt">${r[1]}</span></div>`}).join('')}</div><button class="btn blue" data-a="again">PLAY AGAIN</button>`}
if(S.scr=='admin'){const A=att().slice().reverse();
h=`<h2>ADMIN</h2><div class="sm">${A.length} ATTEMPTS · DELETE SCORES</div><div class="lb">${A.map(x=>`<div class="lr"><div class="nm">${E(x.name)}<div style="font-size:11px;color:#9fb3d9;margin-top:3px">${E(x.dept)}</div></div><span class="pt">${x.total}</span><button class="mini" data-a="del" data-v="${x.id}">${S.cf==x.id?'SURE?':'DELETE'}</button></div>`).join('')||'<div class="sm">NO SCORES YET</div>'}</div><button class="btn rd" data-a="delall">${S.cf=='*'?'TAP AGAIN TO CLEAR':'CLEAR ALL SCORES'}</button><button class="btn yel" data-a="exit">EXIT ADMIN</button>`}
a.innerHTML=h;const k=S.scr+S.i+!!S.rev;if(k!=S.key){S.key=k;window.scrollTo(0,0)}}
function act(a,v){
if(a=='start')S.scr='reg';
else if(a=='board'){S.last=S.scr=='end';S.scr='board'}
else if(a=='pick')S.dept=v;
else if(a=='go')Object.assign(S,{i:0,sel:[],rev:null,scores:[],err:'',scr:'play'});
else if(a=='tg'){if(S.rev)return;const k=S.sel.indexOf(v);if(k>=0){S.sel.splice(k,1);S.err=''}else if(S.sel.length<5){S.sel.push(v);S.err=''}else S.err='ONLY 5 CLUES · TAP ONE TO UNMARK'}
else if(a=='sub'){const s=SC[S.i],ok=Object.keys(s.signals),n=S.sel.filter(x=>ok.includes(x)).length;S.rev={ok,n,pts:n*4};S.scores.push(n*4)}
else if(a=='next'){S.rev=null;S.sel=[];S.err='';if(S.i<4)S.i++;else{S.total=S.scores.reduce((p,c)=>p+c,0);const A=att();A.push({id:Date.now()+Math.random().toString(36).slice(2,6),name:S.name,dept:S.dept,scores:S.scores,total:S.total,ts:new Date().toISOString()});sv('cnp_att',A);S.scr='end'}}
else if(a=='again')Object.assign(S,{scr:'intro',name:'',dept:'',last:false});
else if(a=='del'){if(S.cf!=v)S.cf=v;else{sv('cnp_att',att().filter(x=>x.id!=v));S.cf=null}}
else if(a=='delall'){if(S.cf!='*')S.cf='*';else{sv('cnp_att',[]);S.cf=null}}
else if(a=='exit'){S.scr='intro';S.cf=null}
render()}
document.addEventListener('click',e=>{if(e.target.id=='tt'){if(++taps>=5){taps=0;S.scr='admin';render()}return}const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id=='nm'){S.name=e.target.value.trim();const b=document.querySelector('[data-a=go]');if(b)b.disabled=!(S.name&&S.dept)}});
addEventListener('resize',fit);fit();if(location.hash=='#admin')S.scr='admin';addEventListener('hashchange',()=>{if(location.hash=='#admin'){S.scr='admin';render()}});render();
</script></body></html>
